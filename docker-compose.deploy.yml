services:
  chat_front:
    image: 505265310396.dkr.ecr.us-east-1.amazonaws.com/chat_front:latest
    container_name: chat_front
    ports:
      - "3000:8080"
    depends_on:
      - chat_svc
    restart: unless-stopped
  chat_svc:
    image: 505265310396.dkr.ecr.us-east-1.amazonaws.com/chat_svc:latest
    container_name: chat_svc
    ports:
      - "5000:8081"
    depends_on:
      - chat_db
    restart: unless-stopped

  chat_db:
    image: 505265310396.dkr.ecr.us-east-1.amazonaws.com/chat_db:latest
    container_name: chat_db
    ports:
      - "5001:8080"
    environment:
      DB_URI: ${DB_URI:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ms_db}
      DB_USER: ${DB_USER:-thecloudchief}
      DB_PASSWORD: ${DB_PASSWORD:-}
    restart: unless-stopped