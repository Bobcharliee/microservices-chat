version: "3.8"
services:
  chat_front:
    build:
      context: ./chat_front
      dockerfile: Dockerfile
    container_name: chat_front
    ports:
      - "3000:8080"
    depends_on:
      - chat_svc

  chat_svc:
    build:
      context: ./chat_svc
      dockerfile: Dockerfile
    container_name: chat_svc
    ports:
      - "5000:8080"
    depends_on:
      - chat_db

  chat_db:
    build:
      context: ./chat_db
      dockerfile: Dockerfile
    container_name: chat_db
    ports:
      - "5001:8080"
    
    
    environment:
      DB_URI: ${DB_URI:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-chatdb}
      DB_USER: ${DB_USER:-thecloudchief}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ~/.aws:/root/.aws:ro
